name: compare

# Server comparison: every matrix job runs server A and server B (a kestrel pre-release or the upstream reference build)
# ON THE SAME RUNNER in alternating rounds, on the same TPC-H data and the same schema-qualified queries.
on:
  workflow_dispatch:
    inputs:
      wave:
        description: 'Wave file in ci/waves (without .json)'
        default: 'c2-speed'
      rounds:
        description: 'A/B rounds per job (A B, B A, ...)'
        default: '3'
      upstream-ref:
        description: 'up-native: upstream branch or full 40-char SHA (VadimSurpin/arrow-flight-server, built read-only; a branch is resolved to its head at dispatch)'
        default: 'feat/starrocks-native-integration'
      upstream-main-ref:
        description: 'up-main: upstream branch or full SHA (default: main at our fork point)'
        default: 'dbacd8d585bce2ef2a449c821fe3a53cc6060b57'
      ours-new:
        description: 'kestrel id for the alias ours-new (pinned to the build of the first comparison run; empty = newest C0fuge/kestrel server-1.0.0-* pre-release at dispatch)'
        default: '7562a5bdb7b9'
      ours-cache:
        description: 'kestrel id for the alias ours-cache (newer pre-release with the S3 read cache; final run of the task)'
        default: '4e77c6bda59a'
      only:
        description: 'Comma-separated job ids (<variant>-<storage>) to run from the wave (empty = all)'
        default: ''
      merge-run:
        description: 'Report from this run plus the finished jobs of an earlier compare run (run id; empty = none)'
        default: ''
      merge-prefix:
        description: 'Only jobs of merge-run whose id starts with one of these comma-separated prefixes'
        default: 'new-vs-27f5-'

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/data/default
          key: tpch-default-sf1-sf10-v1
          lookup-only: true
      - name: Generate TPC-H SF1 + SF10 (DuckDB dbgen)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q duckdb==1.4.1
          D="$RUNNER_TEMP/data/default"
          "$RUNNER_TEMP/venv/bin/python" ci/datagen.py gen "$D/sf1" 1
          "$RUNNER_TEMP/venv/bin/python" ci/datagen.py gen "$D/sf10" 10
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/data/default
          key: tpch-default-sf1-sf10-v1

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      upstream: ${{ steps.m.outputs.upstream }}
      upbuilds: ${{ steps.m.outputs.upbuilds }}
      servers: ${{ steps.m.outputs.servers }}
      trino: ${{ steps.m.outputs.trino }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          WAVE: ${{ inputs.wave }}
          ONLY: ${{ inputs.only }}
          OURS_NEW: ${{ inputs.ours-new }}
          OURS_CACHE: ${{ inputs.ours-cache }}
          UP_NATIVE: ${{ inputs.upstream-ref }}
          UP_MAIN: ${{ inputs.upstream-main-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # aliases: ours-new = newest kestrel pre-release now, ours-<id prefix> = that release, up-native / up-main = upstream heads now
          if [ -z "$OURS_NEW" ]; then
            OURS_NEW=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/C0fuge/kestrel/releases?per_page=30" \
              | jq -r '[.[] | select(.prerelease and (.tag_name | startswith("server-1.0.0-")))] | sort_by(.published_at) | last | .tag_name' | sed 's/^server-1.0.0-//')
          fi
          sha() { case $1 in *[!0-9a-f]*|"") git ls-remote https://github.com/VadimSurpin/arrow-flight-server "refs/heads/$1" | cut -f1;; *) echo "$1";; esac; }
          export OURS_NEW UP_NATIVE_SHA=$(sha "$UP_NATIVE") UP_MAIN_SHA=$(sha "$UP_MAIN")
          echo "ours-new=$OURS_NEW up-native=$UP_NATIVE_SHA up-main=$UP_MAIN_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$OURS_NEW" ] && [ ${#UP_NATIVE_SHA} = 40 ] && [ ${#UP_MAIN_SHA} = 40 ]
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          w = json.load(open(f"ci/waves/{os.environ['WAVE']}.json"))
          alias = {"ours-new": os.environ["OURS_NEW"], "ours-27f5": "27f583adccd7", "ours-cache": os.environ.get("OURS_CACHE", "")}
          up = {"up-native": os.environ["UP_NATIVE_SHA"], "up-main": os.environ["UP_MAIN_SHA"]}
          for j in w:
              j["id"] = f"{j['variant']}-{j['storage']}".replace("+", "_")
              for s in "ab":
                  j[f"{s}_name"] = j[f"{s}_server"]
                  j[f"{s}_server"] = alias.get(j[f"{s}_server"], j[f"{s}_server"])
          only = [x for x in os.environ.get("ONLY", "").split(",") if x]
          if only:
              w = [j for j in w if j["id"] in only or j["variant"] in only]
          used = sorted({j[f"{s}_server"] for j in w for s in "ab"} & set(up))
          print("matrix=" + json.dumps({"include": w}))
          print("upstream=" + str(bool(used)).lower())
          print("upbuilds=" + json.dumps([{"name": n, "ref": up[n]} for n in used] or [{"name": "none", "ref": ""}]))
          print("servers=" + json.dumps(alias | up))
          print("trino=" + str(any("trino" in j["workloads"].split() for j in w)).lower())
          EOF

  upstream:
    needs: plan
    if: needs.plan.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.upbuilds) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: VadimSurpin/arrow-flight-server
          ref: ${{ matrix.ref }}
          path: up
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: up/**/pom.xml
      - name: Build shaded server jar (tests skipped) + its provided (Hadoop) dependencies
        working-directory: up
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests -Dcheckstyle.skip -Dspotbugs.skip -Djacoco.skip -Denforcer.skip -pl flight-server -am install   # runner-local ~/.m2 only: copy-dependencies needs the sibling modules
          ./mvnw -B -ntp -pl flight-server dependency:copy-dependencies -DincludeScope=provided -DoutputDirectory="$RUNNER_TEMP/up/libs"
          # S3: hadoop-aws + the AWS SDK modules S3A loads, resolved exactly as upstream's docker/Dockerfile.bench does
          # (refs without docker/hadoop-aws, e.g. main, have no S3 settings at all: their S3 jobs are n/a)
          if [ -f docker/hadoop-aws/pom.xml ]; then
            ./mvnw -B -ntp -f docker/hadoop-aws/pom.xml dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory="$RUNNER_TEMP/up/libs"
          fi
      - name: Collect
        run: |
          O="$RUNNER_TEMP/up"; ls -la up/flight-server/target/*.jar
          j=$(ls -S up/flight-server/target/*.jar | grep -vE 'original-|sources|javadoc|tests' | head -1)
          cp "$j" "$O/server.jar"
          echo "${{ matrix.name }} $(git -C up rev-parse HEAD) $(git -C up log -1 --format=%cs) $(basename "$j")" > "$O/REF.txt"
          (cd "$O" && sha256sum server.jar libs/*.jar > SHA256SUMS && ls libs | wc -l && cat REF.txt)
          # how the upstream server is configured for Flight compression (Report 2: upstream with and without its ZSTD)
          grep -rniE 'zstd|compression|codec' up --include=*.java --include=*.properties --include=*.md --include=*.sh --include=*.yml \
            | grep -v '/test/' | cut -c1-240 | head -80 > "$O/COMPRESSION.txt" || true
          cat "$O/COMPRESSION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-${{ matrix.name }}
          path: ${{ runner.temp }}/up
          retention-days: 14

  trino-plugin:
    # Trino connector of C0fuge/heron (public, built read-only from main), its Trino TPC-H SF1 queries and DuckDB reference answers
    needs: plan
    if: needs.plan.outputs.trino == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: C0fuge/heron
          ref: main
          path: heron
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build plugin (Trino 455 profile, tests skipped)
        working-directory: heron
        run: mvn -B -ntp -P trino-455 -DskipTests clean package
      - name: Collect
        run: |
          T="$RUNNER_TEMP/trino"; mkdir -p "$T"
          cp heron/trino-arrow-flight/target/trino-arrow-flight-*.zip "$T/plugin.zip"
          cp -r heron/e2e/ci/queries heron/e2e/ci/reference/sf1 heron/e2e/ci/compare.py "$T/"
          git -C heron rev-parse HEAD > "$T/REF.txt"; cat "$T/REF.txt"; ls -l "$T"
      - uses: actions/upload-artifact@v4
        with:
          name: trino-plugin
          path: ${{ runner.temp }}/trino
          retention-days: 14

  ab:
    needs: [data, plan, upstream, trino-plugin]
    if: ${{ !cancelled() && needs.data.result == 'success' && needs.plan.result == 'success' && needs.upstream.result != 'cancelled' && needs.trino-plugin.result != 'cancelled' && needs.trino-plugin.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/data/default
          key: tpch-default-sf1-sf10-v1
          fail-on-cache-miss: true
      - if: startsWith(matrix.a_server, 'up-') || startsWith(matrix.b_server, 'up-')
        uses: actions/download-artifact@v4
        with:
          pattern: upstream-up-*
          path: ${{ runner.temp }}/upstream
      - if: contains(matrix.workloads, 'trino')
        uses: actions/download-artifact@v4
        with:
          name: trino-plugin
          path: ${{ runner.temp }}/assets/trino
      - name: Assets
        env:
          SERVERS: ${{ matrix.a_server }} ${{ matrix.b_server }}
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: bash ci/setup-compare.sh "$RUNNER_TEMP/assets"
      - name: Reference answers (in-process DuckDB on the same Parquet files)
        run: |
          OUT="$RUNNER_TEMP/out/${{ matrix.id }}"; mkdir -p "$OUT/ref"
          for sf in sf1 sf10; do
            "$RUNNER_TEMP/assets/venv/bin/python" clients/tpch_adbc.py "duckdb:$RUNNER_TEMP/data/default/$sf" queries/tpch-schema 1 "$OUT/ref/adbc${sf#sf}" > /dev/null
            cut -f1-4 "$OUT/ref/adbc${sf#sf}/summary.tsv"
          done
      - name: A ${{ matrix.a_server }} vs B ${{ matrix.b_server }} (${{ matrix.storage }})
        env:
          VARIANT: ${{ matrix.variant }}
          SERVER_A: ${{ matrix.a_server }}
          SERVER_B: ${{ matrix.b_server }}
          NAME_A: ${{ matrix.a_name }}
          NAME_B: ${{ matrix.b_name }}
          SERVERS_JSON: ${{ needs.plan.outputs.servers }}
          FLAGS_A: ${{ matrix.a_flags }}
          FLAGS_B: ${{ matrix.b_flags }}
          STORAGE: ${{ matrix.storage }}
          ROUNDS: ${{ inputs.rounds }}
          WORKLOADS: ${{ matrix.workloads }}
          SMALL_CLASSES: ${{ matrix.small_classes }}
        run: |
          nproc; free -g; grep -m1 'model name' /proc/cpuinfo; df -h "$RUNNER_TEMP" | tail -1
          OUT="$RUNNER_TEMP/out/${{ matrix.id }}"; mkdir -p "$OUT"
          python3 - "$OUT/job.json" <<'EOF'
          import json, os, sys
          keys = ["VARIANT", "SERVER_A", "SERVER_B", "NAME_A", "NAME_B", "FLAGS_A", "FLAGS_B", "STORAGE", "ROUNDS", "WORKLOADS", "SMALL_CLASSES"]
          cpu = next((l.split(":", 1)[1].strip() for l in open("/proc/cpuinfo") if l.startswith("model name")), "")
          mem = next(int(l.split()[1]) // 1024 for l in open("/proc/meminfo") if l.startswith("MemTotal"))
          json.dump({k.lower(): os.environ.get(k, "") for k in keys} | {"servers": json.loads(os.environ["SERVERS_JSON"]), "kernel": os.uname().release,
                     "mem_mb": mem, "runner": f"{os.environ.get('RUNNER_OS')} {os.environ.get('ImageOS', '')} {os.cpu_count()} vCPU {cpu}"},
                    open(sys.argv[1], "w"), indent=1)
          EOF
          ASSETS="$RUNNER_TEMP/assets" DATA="$RUNNER_TEMP/data" OUT="$OUT" QUERIES="$PWD/queries/tpch-schema" bash ci/ab.sh
          # results in the job log too (artifacts are not readable from every environment)
          for f in "$OUT"/[AB]/r*/result.txt; do echo "== $f"; cat "$f"; done
          for f in "$OUT"/[AB]/r*/container.txt; do echo "== $f"; tail -3 "$f"; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-${{ matrix.id }}
          path: ${{ runner.temp }}/out/
          retention-days: 14

  aggregate:
    needs: [plan, ab]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: ab-*
          path: ${{ runner.temp }}/art
      - if: inputs.merge-run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: ab-*
          path: ${{ runner.temp }}/merge
          run-id: ${{ inputs.merge-run }}
          github-token: ${{ github.token }}
      - name: Tables
        env:
          MERGE_PREFIX: ${{ inputs.merge-prefix }}
          WAVE: ${{ inputs.wave }}
          UPREF: ${{ needs.plan.outputs.servers }}
        run: |
          mkdir -p "$RUNNER_TEMP/jobs"
          for d in "$RUNNER_TEMP"/art/ab-*; do for j in "$d"/*/; do cp -r "$j" "$RUNNER_TEMP/jobs/"; done; done
          # finished jobs of an earlier run (merge-run): only the listed prefixes, never over a job of this run
          for j in "$RUNNER_TEMP"/merge/ab-*/*/; do
            [ -d "$j" ] || continue; n=$(basename "$j")
            for p in ${MERGE_PREFIX//,/ }; do
              case $n in "$p"*) [ -e "$RUNNER_TEMP/jobs/$n" ] || { cp -r "$j" "$RUNNER_TEMP/jobs/"; echo "merged $n"; };; esac
            done
          done
          R="results/$WAVE-$GITHUB_RUN_ID"
          python3 ci/compare.py "$RUNNER_TEMP/jobs" "$R" "Wave $WAVE (server comparison), run $GITHUB_RUN_ID" > /dev/null
          python3 ci/speed_report.py "$RUNNER_TEMP/jobs" "$R/speed.md" "$GITHUB_RUN_ID" || true
          case $WAVE in *load*|track-*) python3 ci/load_report.py "$RUNNER_TEMP/jobs" "$R/load.md" "$GITHUB_RUN_ID" || true;; esac
          case $WAVE in *robust*|*threads*|track-*) python3 ci/robust_report.py "$RUNNER_TEMP/jobs" "$R/robust.md" "$GITHUB_RUN_ID" || true;; esac
          cat "$R/summary.md" >> "$GITHUB_STEP_SUMMARY"
          python3 ci/readme.py
          git config user.name C0fuge
          git config user.email 189659128+C0fuge@users.noreply.github.com
          git add results README.md
          git commit -m "Results: wave $WAVE (run $GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
