name: screen

# A/B screening of Arrow Flight SQL server settings: every matrix job compares the default configuration with one
# variant ON THE SAME RUNNER (alternating rounds), so runner-to-runner noise cancels out. Results are ratios.
on:
  workflow_dispatch:
    inputs:
      wave:
        description: 'Wave file in ci/waves (without .json)'
        default: 'w0-smoke'
      rounds:
        description: 'A/B rounds per job (A B, B A, ...)'
        default: '3'
      workloads:
        description: 'Workloads: small sf1 sf10 scan heavy4'
        default: 'small sf1 sf10 scan heavy4'
      server-build:
        description: 'Server release id of C0fuge/kestrel (server-1.0.0-<id>)'
        default: '4eaab052deaf'
      only:
        description: 'Comma-separated variant names to run from the wave (empty = all)'
        default: ''

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/data/default
          key: tpch-default-sf1-sf10-v1
          lookup-only: true
      - name: Generate TPC-H SF1 + SF10 (DuckDB dbgen)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q duckdb==1.4.1
          D="$RUNNER_TEMP/data/default"
          "$RUNNER_TEMP/venv/bin/python" ci/datagen.py gen "$D/sf1" 1
          "$RUNNER_TEMP/venv/bin/python" ci/datagen.py gen "$D/sf10" 10
          du -sh "$D"/*
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/data/default
          key: tpch-default-sf1-sf10-v1

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          WAVE: ${{ inputs.wave }}
          ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          w = json.load(open(f"ci/waves/{os.environ['WAVE']}.json"))
          only = [x for x in os.environ.get("ONLY", "").split(",") if x]
          if only:
              w = [j for j in w if j["variant"] in only]
          for j in w:
              j["id"] = f"{j['variant']}-{j['storage']}".replace("+", "_")
          print("matrix=" + json.dumps({"include": w}))
          EOF

  ab:
    needs: [data, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/data/default
          key: tpch-default-sf1-sf10-v1
          fail-on-cache-miss: true
      - name: Assets
        env:
          SERVER_BUILD: ${{ inputs.server-build }}
        run: bash ci/setup.sh "$RUNNER_TEMP/assets"
      - name: Data layout ${{ matrix.layout }}
        if: matrix.layout != 'default'
        run: |
          for sf in sf1 sf10; do
            "$RUNNER_TEMP/assets/venv/bin/python" ci/datagen.py relayout "$RUNNER_TEMP/data/default/$sf" "$RUNNER_TEMP/data/${{ matrix.layout }}/$sf" "${{ matrix.layout }}"
          done
      - name: A/B ${{ matrix.variant }} (${{ matrix.storage }})
        env:
          VARIANT: ${{ matrix.variant }}
          FLAGS_B: ${{ matrix.flags }}
          LAYOUT_B: ${{ matrix.layout }}
          STORAGE: ${{ matrix.storage }}
          ROUNDS: ${{ inputs.rounds }}
          WORKLOADS: ${{ inputs.workloads }}
        run: |
          nproc; free -g; df -h "$RUNNER_TEMP" | tail -1
          OUT="$RUNNER_TEMP/out/${{ matrix.id }}"; mkdir -p "$OUT"
          python3 -c "import json,os; json.dump({k: os.environ[v] for k, v in [('variant','VARIANT'),('flags','FLAGS_B'),('layout','LAYOUT_B'),('storage','STORAGE'),('rounds','ROUNDS'),('workloads','WORKLOADS')]} | {'runner_cpus': os.cpu_count()}, open('$OUT/job.json','w'))"
          ASSETS="$RUNNER_TEMP/assets" DATA="$RUNNER_TEMP/data" OUT="$OUT" bash ci/ab.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-${{ matrix.id }}
          path: ${{ runner.temp }}/out/
          retention-days: 14

  aggregate:
    needs: [ab]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ab-*
          path: ${{ runner.temp }}/art
      - name: Tables
        env:
          WAVE: ${{ inputs.wave }}
          BUILD: ${{ inputs.server-build }}
        run: |
          mkdir -p "$RUNNER_TEMP/jobs"
          for d in "$RUNNER_TEMP"/art/ab-*; do for j in "$d"/*/; do cp -r "$j" "$RUNNER_TEMP/jobs/"; done; done
          R="results/$WAVE-$GITHUB_RUN_ID"
          python3 ci/aggregate.py "$RUNNER_TEMP/jobs" "$R" "Wave $WAVE, server $BUILD, run $GITHUB_RUN_ID" > /dev/null
          cat "$R/summary.md" >> "$GITHUB_STEP_SUMMARY"
          python3 ci/readme.py
          git config user.name C0fuge
          git config user.email 189659128+C0fuge@users.noreply.github.com
          git add results README.md
          git commit -m "Results: wave $WAVE (run $GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
