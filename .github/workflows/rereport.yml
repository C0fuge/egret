name: rereport

# Re-run the report scripts of an earlier compare run on its job artifacts (no new measurements) and commit the
# regenerated files into results/<wave>-<run id>/.
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'compare run id whose ab-* artifacts are re-reported'
        required: true
      wave:
        description: 'Wave of that run (without .json)'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: ab-*
          path: ${{ runner.temp }}/art
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
      - name: Tables
        env:
          WAVE: ${{ inputs.wave }}
          RUN: ${{ inputs.run-id }}
        run: |
          mkdir -p "$RUNNER_TEMP/jobs"
          for d in "$RUNNER_TEMP"/art/ab-*; do for j in "$d"/*/; do cp -r "$j" "$RUNNER_TEMP/jobs/"; done; done
          R="results/$WAVE-$RUN"; mkdir -p "$R"
          python3 ci/speed_report.py "$RUNNER_TEMP/jobs" "$R/speed.md" "$RUN" > /dev/null
          case $WAVE in *load*) python3 ci/load_report.py "$RUNNER_TEMP/jobs" "$R/load.md" "$RUN";; esac
          case $WAVE in *robust*|*threads*) python3 ci/robust_report.py "$RUNNER_TEMP/jobs" "$R/robust.md" "$RUN";; esac
          git config user.name C0fuge
          git config user.email 189659128+C0fuge@users.noreply.github.com
          git add results
          git commit -m "Results: re-report wave $WAVE (run $RUN)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
