name: rereport

# Re-run the report scripts of an earlier compare run on its job artifacts (no new measurements) and commit the
# regenerated files into results/<wave>-<run id>/.
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'compare run id whose ab-* artifacts are re-reported'
        required: true
      wave:
        description: 'Wave of that run (without .json)'
        required: true
      load:
        description: 'also run ci/load_report.py when the wave name does not ask for it (e.g. fresh-up-*)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: ab-*
          path: ${{ runner.temp }}/art
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
      - name: Tables
        env:
          WAVE: ${{ inputs.wave }}
          RUN: ${{ inputs.run-id }}
          LOAD: ${{ inputs.load }}
        run: |
          mkdir -p "$RUNNER_TEMP/jobs"
          for d in "$RUNNER_TEMP"/art/ab-*; do for j in "$d"/*/; do cp -r "$j" "$RUNNER_TEMP/jobs/"; done; done
          # three-way jobs (side C), as in compare.yml aggregate: <id>-vs-<c name> = C as side A against B
          for j in "$RUNNER_TEMP"/jobs/*/; do
            [ -d "$j/C" ] || continue; n=$(basename "$j")
            t="$RUNNER_TEMP/jobs/$n-vs-$(jq -r .name_c "$j/job.json")"; mkdir -p "$t"
            cp -r "$j/C" "$t/A"; cp -r "$j/B" "$t/B"; [ -d "$j/ref" ] && cp -r "$j/ref" "$t/ref"
            jq '.server_a = .server_c | .name_a = .name_c | .flags_a = .flags_c | .variant += "-vs-" + .name_c' "$j/job.json" > "$t/job.json"
            rm -rf "$j/C"; echo "split $n -> $(basename "$t")"
          done
          R="results/$WAVE-$RUN"; mkdir -p "$R"
          python3 ci/speed_report.py "$RUNNER_TEMP/jobs" "$R/speed.md" "$RUN" > /dev/null
          [ "$LOAD" = true ] && WL=load || WL=$WAVE
          case $WL in *load*|track-*) python3 ci/load_report.py "$RUNNER_TEMP/jobs" "$R/load.md" "$RUN" || true;; esac
          case $WAVE in *robust*|*threads*|track-*) python3 ci/robust_report.py "$RUNNER_TEMP/jobs" "$R/robust.md" "$RUN" || true;; esac
          git config user.name C0fuge
          git config user.email 189659128+C0fuge@users.noreply.github.com
          git add results
          git commit -m "Results: re-report wave $WAVE (run $RUN)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
